# Pytest configuration for tauri-v2-desktop-builder skill tests
# Tests validate the bump-version.js script

[pytest]
minversion = 7.0

python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --strict-markers
    --disable-warnings

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
